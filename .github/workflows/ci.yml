name: Continuous Integration

# This action works with pull requests and pushes
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typescriptCheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Build lib
        run: pnpm build:packages

      - name: Typescript check
        run: pnpm tsc
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Build lib
        run: pnpm build:packages

      - name: Run tests
        run: pnpm test:rest
  # The engine suite renders audio in real time. It gets a runner to itself,
  # because sharing CPU with the other suites is what made it flaky.
  testEngine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Build lib
        run: pnpm build:packages

      - name: Run engine tests
        run: pnpm test:engine
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Build lib
        run: pnpm build:packages

      - name: Lint code
        run: pnpm lint
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Prettify code
        run: pnpm format:check
